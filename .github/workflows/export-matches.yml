name: Export OpenDota match JSON to the data branch

# Snapshots whatever OpenDota already has for each of an account's matches
# into the `data` branch (one minified JSON file per match, sharded by the
# last two digits of match_id - see data branch README for the layout) so
# the dashboard - and you - own a permanent copy, independent of OpenDota's
# API/availability going forward.
#
# This only ever GETs data that already exists on OpenDota (it does not
# request new parses - see request-parse.yml / backfill-parse.yml for
# that). Matches already exported are skipped, so this is naturally
# resumable: just re-run it (Actions tab -> this workflow -> Run workflow)
# to pick up wherever it left off and pull in anything new since.

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: "OpenDota account_id to export"
        default: "90031862"
      batch_size:
        description: "How many NOT-yet-exported matches to fetch in this run"
        default: "1500"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    # Safety net on top of the per-request curl timeouts below: a run
    # should never take anywhere near this long, so if it does, something's
    # stuck (this bit us once - a hung curl call with no timeout sat
    # "in_progress" for the better part of an hour without committing
    # anything or even hitting a rate limit).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data

      - name: Export match JSON
        env:
          ACCOUNT_ID: ${{ github.event.inputs.account_id }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: |
          set -uo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commits (and pushes) whatever's been fetched so far. Called
          # periodically during the loop below, not just once at the end -
          # a run that gets cancelled or hits the timeout-minutes cutoff
          # (below) would otherwise lose everything it fetched, since
          # nothing would ever have been committed. This bit us once: a
          # 90-minute run fetched 3000 matches and lost all of them when it
          # got cancelled a few seconds before an end-of-run commit step.
          commit_progress() {
            git add matches
            if ! git diff --cached --quiet; then
              git commit -q -m "Export match JSON [skip ci]"
              git push -q
            fi
          }

          api_key_arg=()
          if [ -n "$API_KEY" ]; then
            api_key_arg=(--data-urlencode "api_key=$API_KEY")
          fi

          echo "Fetching full match list for account $ACCOUNT_ID..."
          # GitHub Actions runs this script with `bash -e`, so a single
          # timed-out request here (OpenDota being briefly slow - this
          # endpoint returns the whole match history in one call, no
          # retries needed for anything else in this script) would abort
          # the entire run before anything's even been fetched. Retry a
          # few times rather than needing a human to notice and re-trigger.
          matches_json=""
          for attempt in 1 2 3; do
            if matches_json=$(curl -sS -G --connect-timeout 10 --max-time 60 "https://api.opendota.com/api/players/$ACCOUNT_ID/matches" \
              --data-urlencode "significant=0" \
              --data-urlencode "limit=20000" \
              "${api_key_arg[@]}"); then
              break
            fi
            echo "Match list fetch failed (attempt $attempt/3), retrying in 10s..."
            sleep 10
          done

          total=$(echo "$matches_json" | jq 'length')
          echo "Total matches on record: $total"

          if [ -z "$total" ] || [ "$total" = "0" ] || [ "$total" = "null" ]; then
            echo "No matches returned - check the account_id."
            exit 0
          fi

          # This lightweight per-match summary list (kills/deaths/duration/
          # hero_id/etc, not the full match detail) is what the site's
          # Matches list, Trends and win/loss count need - write it out so
          # they can read it from here instead of hitting OpenDota's live
          # /players/{id}/matches endpoint on every page load. Committed
          # immediately (own commit, separate from the per-match files
          # below) so it's fresh as soon as this step runs, regardless of
          # how much of the rest of the export completes.
          echo "$matches_json" | jq -c 'sort_by(.match_id) | reverse' > matches-index.json
          git add matches-index.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Update match list index [skip ci]"
            git push -q
          fi

          # Newest first, so a partial/interrupted run still covers your
          # most-likely-to-be-viewed matches before older ones.
          mapfile -t all_ids < <(echo "$matches_json" | jq -r 'sort_by(.match_id) | reverse | .[].match_id')

          already=0
          fetched=0
          fetched_since_commit=0
          rate_limited=false

          for id in "${all_ids[@]}"; do
            shard="${id: -2}"
            dir="matches/$shard"
            file="$dir/$id.json"

            if [ -f "$file" ]; then
              already=$((already + 1))
              continue
            fi

            if [ "$fetched" -ge "$BATCH_SIZE" ]; then
              break
            fi

            status=$(curl -sS -G --connect-timeout 10 --max-time 30 -o /tmp/match.json -w "%{http_code}" "https://api.opendota.com/api/matches/$id" "${api_key_arg[@]}" || echo "000")
            if [ "$status" = "429" ]; then
              echo "Hit the rate limit at match $id - stopping this run early."
              rate_limited=true
              break
            fi
            if [ "$status" != "200" ]; then
              echo "  match $id: HTTP $status, skipping"
              sleep 1.2
              continue
            fi

            mkdir -p "$dir"
            jq -c '.' /tmp/match.json > "$file"
            fetched=$((fetched + 1))
            fetched_since_commit=$((fetched_since_commit + 1))

            if (( fetched % 50 == 0 )); then
              echo "  ...$fetched fetched this run (already had $already, latest: $id)"
            fi
            if (( fetched_since_commit >= 200 )); then
              commit_progress
              fetched_since_commit=0
            fi
            sleep 1.2
          done

          commit_progress

          echo "Already had $already matches. Fetched $fetched new ones this run."

          remaining=$(( total - already - fetched ))
          {
            echo "### Export run summary"
            echo "- Already exported: $already"
            echo "- Fetched this run: $fetched"
            echo "- Remaining: $remaining of $total"
            if [ "$rate_limited" = "true" ]; then
              echo "- Stopped early: hit OpenDota's rate limit. Re-run to continue."
            elif [ "$remaining" -gt 0 ]; then
              echo "- Re-run this workflow to continue."
            else
              echo "- All matches exported!"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
